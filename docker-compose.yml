services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672" # Management UI (dev only)
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/main-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/fluent_audio_split.db
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    volumes:
      - api-data:/data
      - shared-audio:/data/audio
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./src/audio-separation-worker
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - SHARED_DATA_PATH=/data/audio
    volumes:
      - shared-audio:/data/audio
    depends_on:
      rabbitmq:
        condition: service_healthy

  front:
    build:
      context: ./src/front
      dockerfile: Dockerfile
      args:
        VITE_SERVICE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  api-data:
  shared-audio:
