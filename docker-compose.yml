services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  api:
    build:
      context: ./src/main-api
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/fluent_audio_split.db
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      # Optional residential/trusted egress proxy for YouTube imports. Datacenter
      # IPs are frequently blocked by YouTube; leave empty to connect directly.
      - YouTubeAudioImport__ProxyUrl=${YOUTUBE_IMPORT_PROXY_URL:-}
    volumes:
      - api-data:/data
      - shared-audio:/data/audio
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  worker:
    build:
      context: ./src/audio-separation-worker
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - SHARED_DATA_PATH=/data/audio
      - AUDIO_SEPARATOR_MODEL_DIR=/models
      - AUDIO_SEPARATOR_API_URL=${AUDIO_SEPARATOR_API_URL:-}
      - AUDIO_SEPARATOR_API_KEY=${AUDIO_SEPARATOR_API_KEY:-}
    volumes:
      - shared-audio:/data/audio
      - model-cache:/models
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 5G

  front:
    build:
      context: ./src/front
      dockerfile: Dockerfile
      args:
        VITE_SERVICE_URL: ${VITE_SERVICE_URL:-http://localhost:8765}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  gateway:
    image: nginx:alpine
    ports:
      - "8765:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - front
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

volumes:
  api-data:
  shared-audio:
  model-cache:
