services:
  api:
    build:
      context: ./src/main-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/fluent_audio_split.db
    volumes:
      - api-data:/data

  front:
    build:
      context: ./src/front
      dockerfile: Dockerfile
      args:
        VITE_SERVICE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  api-data:
