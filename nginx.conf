events {}

http {
  server {
    listen 80;
    client_max_body_size 500M;

    location /api/ {
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # Server-Sent Events (GET /api/executions/{id}/stream) are long-lived. Use HTTP/1.1 with
      # keep-alive, disable proxy buffering, and raise the read timeout well past the default 60s
      # so streams aren't cut off mid-execution.
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://front:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
